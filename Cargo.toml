[package]
name = "ytmusicdw"
version = "0.1.0"
edition = "2021"
description = "Paste a YouTube playlist link, pick tracks, download as CD-audio-spec WAV via yt-dlp/ffmpeg, and burn a Red Book audio CD."
license = "MIT"
repository = "https://github.com/chrollo-03/YTmusicDW"

[[bin]]
name = "ytmusicdw"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hound = "3.5"
directories = "5"

[profile.release]
opt-level = 3
lto = true
strip = true
